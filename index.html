<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- i18n:redirect -->
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="author" content="Marcel Esplugas Jacobo" />
    <meta name="robots" content="index,follow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Marcel Esplugas Jacobo" />
    <meta property="og:url" content="{{url}}" />
    <meta property="og:title" content="{{title}}" />

    <meta property="og:image:type" content="image/png" />

    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{imageAlt}}" />
    <meta property="og:locale" content="{{ogLocale}}" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="https://marcel14.dev/og-image.png" />
    <meta name="twitter:image:alt" content="{{imageAlt}}" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

        "name": "Marcel Esplugas Jacobo",
        "jobTitle": "Full Stack Developer",
        "url": "https://marcel14.dev/",
        "image": "https://marcel14.dev/logo.png",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Barcelona",

          "MySQL",
          "Docker"
        ],
        "sameAs": [
          "https://github.com/JacobsM14",
          "https://www.linkedin.com/in/m-esplugas/"
        ]
      }
    </script>

    <script
      defer
      src="https://analytics.arcedo.dev/script.js"
      data-website-id="73f03824-7e23-47d6-90aa-631a056638e2"
    ></script>
  </head>
