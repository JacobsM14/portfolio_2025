<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>og-image</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #09090b;
        font-family: "Noto Sans", "Inter", system-ui, sans-serif;
        color: #fff;
      }
      body {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(
            ellipse 700px 420px at 15% 0%,
            rgba(124, 58, 237, 0.28),
            transparent 70%
          ),
          radial-gradient(
            ellipse 600px 380px at 100% 100%,
            rgba(124, 58, 237, 0.16),
            transparent 70%
          ),
          #09090b;
      }
      .card {
        width: 1080px;
        height: 510px;
        padding: 56px 64px;
        display: flex;
        align-items: center;
        gap: 64px;
        border: 2px solid #27272a;
        border-radius: 48px;
        background: rgba(124, 58, 237, 0.05);
      }
      .avatar-halo {
        flex: none;
        width: 232px;
        height: 232px;
        border-radius: 50%;
        background: rgba(124, 58, 237, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .avatar {
        width: 208px;
        height: 208px;
        border-radius: 50%;
        background: #7c3aed;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 84px;
        font-weight: 700;
      }
      .info {
        display: flex;
        flex-direction: column;
        gap: 18px;
        min-width: 0;
      }
      .eyebrow {
        font-size: 28px;
        font-weight: 700;
        color: #7c3aed;
      }
      h1 {
        font-size: 56px;
        line-height: 1.1;
        white-space: nowrap;
        font-weight: 700;
      }
      .role {
        font-size: 36px;
        color: #999;
      }
      .location {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 28px;
        color: #999;
      }
      .location svg {
        width: 30px;
        height: 30px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 10px;
      }
      .chip {
        padding: 6px 20px;
        border-radius: 999px;
        background: rgba(153, 153, 153, 0.4);
        font-size: 24px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="avatar-halo"><div class="avatar">ME</div></div>
      <div class="info">
        <div class="eyebrow">marcel14.dev</div>
        <h1>Marcel Esplugas Jacobo</h1>
        <div class="role">Full Stack Developer</div>
        <div class="location">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path
              fill="currentColor"
              d="M12 3a7 7 0 0 0-7 7c0 2.862 1.782 5.623 3.738 7.762A26 26 0 0 0 12 20.758q.262-.201.615-.49a26 26 0 0 0 2.647-2.504C17.218 15.623 19 12.863 19 10a7 7 0 0 0-7-7m0 20.214l-.567-.39l-.003-.002l-.006-.005l-.02-.014l-.075-.053l-.27-.197a28 28 0 0 1-3.797-3.44C5.218 16.875 3 13.636 3 9.999a9 9 0 0 1 18 0c0 3.637-2.218 6.877-4.262 9.112a28 28 0 0 1-3.796 3.44a17 17 0 0 1-.345.251l-.021.014l-.006.005l-.002.001zM12 8a2 2 0 1 0 0 4a2 2 0 0 0 0-4m-4 2a4 4 0 1 1 8 0a4 4 0 0 1-8 0"
            />
          </svg>
          Barcelona, Spain
        </div>
        <div class="chips">
          <span class="chip">React</span>
          <span class="chip">Node.js</span>
          <span class="chip">TypeScript</span>
          <span class="chip">Tailwind CSS</span>
        </div>
      </div>
    </div>
  </body>
</html>
